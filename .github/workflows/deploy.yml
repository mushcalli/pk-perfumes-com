name: Deploy to Pages

on:
  # Runs on pushes targeting the prod branch
  push:
    branches: ['prod']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7
      - name: Set up Node
        uses: actions/setup-node@v7 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: pain and suffering and pain and suffering and pain and suffering and pain and sufferingW
        run: ls -R
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6 # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5 # v5
        with:
          # Upload build folder
          path: './build/client'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # v5